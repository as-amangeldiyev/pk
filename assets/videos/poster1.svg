<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="100%" height="100%">
  <defs>
    <linearGradient id="vbg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1018"/>
      <stop offset="50%" stop-color="#3d1527"/>
      <stop offset="100%" stop-color="#0f050b"/>
    </linearGradient>
    <linearGradient id="pinkG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#ff758c"/>
    </linearGradient>
  </defs>
  <rect width="360" height="640" fill="url(#vbg1)"/>
  
  <!-- Subtle Volleyball Lines in Background -->
  <circle cx="180" cy="260" r="110" fill="none" stroke="rgba(244, 63, 94, 0.15)" stroke-width="4"/>
  <circle cx="180" cy="260" r="45" fill="url(#pinkG)" filter="drop-shadow(0 0 15px rgba(244, 63, 94, 0.6))"/>
  <polygon points="172,245 195,260 172,275" fill="#ffffff"/>
  
  <text x="180" y="360" font-family="-apple-system, sans-serif" font-weight="800" font-size="22" fill="#ffffff" text-anchor="middle">VOLLEYBALL SPIKE</text>
  <text x="180" y="390" font-family="-apple-system, sans-serif" font-weight="600" font-size="14" fill="#fda4af" text-anchor="middle">Vertical Phone Video (9:16)</text>
  
  <rect x="50" y="440" width="260" height="50" rx="25" fill="rgba(255,255,255,0.08)" stroke="rgba(255,182,193,0.3)"/>
  <text x="180" y="470" font-family="monospace" font-size="12" fill="#fda4af" text-anchor="middle">assets/videos/video1.mp4</text>
  
  <text x="180" y="580" font-family="-apple-system, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">Click or drop your video to view</text>
